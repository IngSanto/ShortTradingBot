name: Paper trading diario

# Puerta 4 de docs/02-metodologia-validacion.md.
#
# Cada día descarga las barras nuevas, avanza el paper trading y commitea el
# estado. Ese commit diario ES el registro de la puerta 4: su valor está en que
# no se pueda rehacer a posteriori.

on:
  schedule:
    # 06:00 UTC. El archivo de Binance publica el fichero diario con 1-2 días de
    # retraso, así que la hora exacta da igual mientras sea una vez al día; ese
    # retraso está modelado con --retraso 1 y medido en docs/03.
    - cron: "0 6 * * *"
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions

concurrency:
  # Dos ejecuciones simultáneas se pisarían el estado y producirían un registro
  # incoherente. Nunca cancelar la que está en curso: iría a medias.
  group: paper-trading
  cancel-in-progress: false

permissions:
  contents: write           # necesario para commitear el estado

jobs:
  operar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        # requirements-dev.txt incluye requirements.txt + pytest: sin esto el
        # runner (que parte limpio, sin nada preinstalado a mano) no tiene
        # pytest y la puerta de pruebas falla antes de poder ejecutarse.
        run: pip install -r requirements-dev.txt

      - name: Comprobar que el motor sigue siendo correcto
        # Si las pruebas fallan NO se opera. Un motor roto produciría un
        # registro falso, que es peor que no tener registro.
        run: python -m pytest tests/ -q

      - name: Refrescar el calendario de eventos macro
        # El filtro de docs/10 veta la vispera y el dia de un FOMC o un IPC, asi
        # que necesita fechas FUTURAS. Si el fichero se queda atras, el filtro
        # deja de vetar sin dar error: el sistema pareceria protegido sin
        # estarlo. Por eso se refresca antes de operar, y por eso el fallo no
        # detiene el dia -paper_run avisa si no hay eventos futuros.
        run: python scripts/fetch_calendario_macro.py || echo "[!] Calendario no actualizado"

      - name: Actualizar datos y avanzar el paper trading
        run: python scripts/paper_run.py --actualizar --riesgo 0.001 --retraso 1

      - name: Generar el dashboard (docs/index.html, GitHub Pages)
        # Estático, sin CDN: se consulta gratis desde cualquier navegador, sin
        # abrir Claude ni gastar tokens. Se regenera aquí, no en cada visita.
        run: python scripts/build_dashboard.py

      - name: Commitear el estado
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "actions@github.com"
          git add state/ data/ docs/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios que registrar."
            exit 0
          fi
          git commit -m "paper: $(date -u +%Y-%m-%d)"

          # main puede haberse movido desde el checkout (un push manual de
          # varios minutos de por medio, por ejemplo): sin este rebase, el
          # primer commit ajeno de por medio tumba el push y se pierde el
          # registro del dia entero. Confirmado en el run del 31-ago-2026
          # (id 33363601283): "! [rejected] main -> main (fetch first)".
          intentos=0
          maximo=5
          while [ "$intentos" -lt "$maximo" ]; do
            if git push origin HEAD:main; then
              exit 0
            fi
            intentos=$((intentos + 1))
            echo "Push rechazado (intento $intentos/$maximo), reintentando tras rebase..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase con conflicto real: no se puede reconciliar en automatico."
              git rebase --abort
              exit 1
            fi
            sleep $((intentos * 3))
          done
          echo "No se pudo empujar el estado tras $maximo intentos."
          exit 1

      - name: Informe en el resumen de la ejecución
        if: always()
        run: |
          {
            echo '## Paper trading'
            echo '```'
            python scripts/paper_run.py --informe 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
